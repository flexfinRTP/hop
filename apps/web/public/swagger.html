<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hop API · Swagger</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #f3ede0;
      }
      .hop-swagger-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 3rem;
        padding: 0 1.2rem;
        color: #2a3026;
        border-bottom: 1px solid rgba(92, 112, 84, 0.16);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.72rem;
      }
      .hop-swagger-bar a {
        color: #5c7054;
        text-decoration: none;
      }
      .swagger-ui .topbar {
        display: none;
      }
      .swagger-ui .info {
        margin: 24px 0;
      }
    </style>
  </head>
  <body>
    <header class="hop-swagger-bar">
      <a href="/docs">← Hop docs</a>
      <span>OpenAPI 3.1 · Hedera exact x402</span>
      <a href="/openapi.yaml">openapi.yaml</a>
    </header>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
      });
    </script>
  </body>
</html>
