openapi: 3.1.0
info:
  title: Hop
  description: Confidential lending-risk query. Hedera exact x402 (Blocky402). Aggregates only.
  version: 0.0.36
servers:
  - url: http://localhost:8787
paths:
  /v1/query:
    post:
      operationId: query
      summary: Paid lending-risk query
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Required on paid retry. Same key → same evidence id, no second settle.
          schema:
            type: string
        - name: X-Hop-Mandate
          in: header
          required: false
          description: Mandate JSON or base64. Budget, velocity, expiry. LLM never pays.
          schema:
            type: string
        - name: X-Hop-Confirm
          in: header
          required: false
          description: "1 after mandate_review (human threshold)."
          schema:
            type: string
        - name: X-Hop-World
          in: header
          required: false
          description: World ID session token from POST /v1/world/verify. Required when WORLD_REQUIRED=1.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Charged outcome (success, stale, or k_anon_denied)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          description: Bad 402 payload — not charged
        "402":
          description: Payment required — not charged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequired"
        "403":
          description: payer_denied, world_required, or mandate DENY/REVIEW — not charged
        "429":
          description: rate_limited — not charged
        "503":
          description: policy_unavailable | graph_unconfigured | facilitator_unavailable | merchant_unconfigured — not charged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/evidence/{id}:
    get:
      operationId: getEvidence
      summary: Public evidence pack (hashes, no rows, no caps)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404":
          description: Unknown id
  /v1/meta:
    get:
      operationId: meta
      summary: Public rails, mandate remaining, HCS, posture (no secrets, no caps)
      responses:
        "200":
          description: Meta
  /v1/mandate:
    get:
      operationId: mandate
      summary: Remaining mandate budget and velocity. Does not pay.
      parameters:
        - name: X-Hop-Mandate
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Mandate inspect
        "404":
          description: mandate_missing
  /v1/evidence/{id}/peac:
    get:
      operationId: getPeac
      summary: PEAC-shaped portable receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PEAC-shaped JSON
        "404":
          description: Unknown id
  /v1/evidence/{id}/verify:
    get:
      operationId: verifyEvidence
      summary: Recompute aggregate hash and check chain link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verify
        "404":
          description: Unknown id
  /v1/events/{id}:
    get:
      operationId: events
      summary: SSE live trace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
  /v1/demo/sign:
    post:
      operationId: demoSign
      summary: Opt-in ExactHederaScheme signer (HOP_DEMO_SIGN=1)
      responses:
        "200":
          description: payment base64
        "403":
          description: demo_sign_disabled
  /v1/world:
    get:
      operationId: worldMeta
      summary: World ID readiness (no secrets)
      responses:
        "200":
          description: World ID config flags
  /v1/world/rp-context:
    post:
      operationId: worldRpContext
      summary: Sign World ID 4.0 RP context (signing key stays on server)
      responses:
        "200":
          description: rp_context fields
        "503":
          description: world_unconfigured
  /v1/world/verify:
    post:
      operationId: worldVerify
      summary: Forward IDKit result to developer.world.org /api/v4/verify and return a hop session token
      responses:
        "200":
          description: token
        "400":
          description: verify failed
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: ok

components:
  schemas:
    QueryType:
      type: string
      enum:
        - market_params
        - position_counts
        - liquidations
        - policy_check
        - account_ltv
    QueryRequest:
      type: object
      required: [query, protocols, max_block_lag]
      properties:
        query:
          $ref: "#/components/schemas/QueryType"
        protocols:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 2
        max_block_lag:
          type: integer
          minimum: 0
        window:
          type: object
          description: liquidations only
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
    QueryStatus:
      type: string
      enum:
        - accept
        - reject
        - k_anon_denied
        - stale
    QueryResponse:
      type: object
      required: [status, evidence]
      properties:
        status:
          $ref: "#/components/schemas/QueryStatus"
        aggregate:
          description: Omitted on stale and k_anon_denied
          type: object
          additionalProperties: true
        evidence:
          $ref: "#/components/schemas/Evidence"
        reason:
          type: object
        mandate:
          type: object
        trace:
          type: array
    PaymentRequired:
      type: object
      required: [x402Version, accepts]
      properties:
        x402Version:
          type: integer
          example: 2
        accepts:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequirements"
    PaymentRequirements:
      type: object
      required: [scheme, network, amount, payTo, maxTimeoutSeconds, asset, extra]
      properties:
        scheme:
          type: string
          enum: [exact]
        network:
          type: string
          example: hedera:testnet
        amount:
          type: string
          description: tinybars when asset is 0.0.0
        payTo:
          type: string
        maxTimeoutSeconds:
          type: integer
        asset:
          type: string
          description: "0.0.0 for HBAR, or HTS token id"
          example: "0.0.0"
        extra:
          type: object
          required: [feePayer]
          properties:
            feePayer:
              type: string
              description: MUST match facilitator GET /supported
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - policy_unavailable
            - not_implemented
            - bad_payment
            - idempotency_required
            - idempotency_conflict
            - payer_denied
            - rate_limited
            - not_found
            - payment_replay
            - graph_unconfigured
            - payload_too_large
            - facilitator_unavailable
            - merchant_unconfigured
            - mandate_required
            - mandate_expired
            - mandate_merchant
            - mandate_query
            - mandate_freshness
            - mandate_per_call
            - mandate_budget
            - mandate_velocity
            - world_required
            - mandate_review
            - bad_mandate
    Evidence:
      type: object
      required:
        - id
        - timestamp
        - query
        - graph
        - policy
        - k_anon
        - aggregate_hash
        - settlement
        - cre
        - status
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        payer_account:
          type: string
        query:
          type: object
          required: [type, params]
          properties:
            type:
              $ref: "#/components/schemas/QueryType"
            params:
              type: object
              additionalProperties: true
              description: No wallet list
        graph:
          type: object
          required: [deployments]
          properties:
            deployments:
              type: array
              items:
                type: object
                required: [id, schemaVersion]
                properties:
                  id:
                    type: string
                  schemaVersion:
                    type: string
                    example: "3.1.0"
                  block:
                    type: integer
        policy:
          type: object
          required: [version, threshold_hash]
          properties:
            version:
              type: string
            threshold_hash:
              type: string
              description: Hash of private table. Never the caps.
        k_anon:
          type: object
          required: [result]
          properties:
            result:
              type: string
              enum: [pass, fail, not_applicable]
        aggregate_hash:
          type: string
        settlement:
          type: object
          required: [ref]
          properties:
            ref:
              type: string
              description: Blocky402 settlement ref
        cre:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [simulation, don]
            artifact:
              type: string
            tee:
              type: string
            trigger:
              type: string
            report_hash:
              type: string
            execution_id:
              type: string
        world:
          type: object
          properties:
            nullifier_hash:
              type: string
              description: SHA-256 of World ID nullifier. Not the raw nullifier.
        status:
          $ref: "#/components/schemas/QueryStatus"
        hcs_seq:
          type: integer
          description: HCS topic sequence when operator (and topic or HOP_HCS_AUTO) is set
        mandate:
          type: object
          properties:
            id:
              type: string
            hash:
              type: string
            remaining_tinybars:
              type: integer
            remaining_hops:
              type: integer
            decision:
              type: string
              enum: [ALLOW, DENY, REVIEW]
        chain:
          type: object
          properties:
            prev:
              type: string
            hash:
              type: string
        meter:
          type: object
          properties:
            amount:
              type: string
            protocols:
              type: integer
        peac_hash:
          type: string
        reason:
          type: object
          properties:
            stamp:
              type: string
            metric_hash:
              type: string
            observed:
              type: number
            freshness:
              type: string
              enum: [live, stale]
        posture:
          type: object
          properties:
            custody:
              type: string
            ofac:
              type: string
            mor:
              type: string
            cre:
              type: string
            ats:
              type: string
