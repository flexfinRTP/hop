# Logical secret ids used inside handlerInTee. Values come from env / Vault DON.
# Empty POLICY_TABLE = policy_unavailable (Chainlink miss).
secretsNames:
  POLICY_TABLE:
    - HOP_POLICY_TABLE_JSON
  GRAPH_API_KEY:
    - GRAPH_API_KEY
  POLICY_COMMITMENT_SALT:
    - HOP_POLICY_COMMITMENT_SALT
  liquidation_rpc_url:
    - LIQUIDATION_RPC_URL
  liquidation_private_key:
    - LIQUIDATION_EXECUTOR_PRIVATE_KEY
  liquidation_min_hf_trigger:
    - LIQUIDATION_MIN_HF_TRIGGER
  liquidation_target_hf:
    - LIQUIDATION_TARGET_HF
  liquidation_max_repay_pct:
    - LIQUIDATION_MAX_REPAY_PCT
  liquidation_max_deposit_units:
    - LIQUIDATION_MAX_DEPOSIT_UNITS
  liquidation_action_priority:
    - LIQUIDATION_ACTION_PRIORITY
  liquidation_safety_margin:
    - LIQUIDATION_SAFETY_MARGIN
  liquidation_cooldown_seconds:
    - LIQUIDATION_COOLDOWN_SECONDS
  liquidation_emergency_hf:
    - LIQUIDATION_EMERGENCY_HF
  liquidation_commitment_salt:
    - LIQUIDATION_COMMITMENT_SALT
